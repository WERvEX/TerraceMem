[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terracemem"
version = "0.1.0"
description = "Trustworthy Agentic Retrieval & Bi-temporal Tiered Memory Engine on Unified PostgreSQL"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "TerraceMem Contributors" },
]
keywords = ["agent", "rag", "memory", "postgresql", "pgvector", "bm25", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "mcp>=2.0.0",
    "structlog>=25.1.0",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
docling = [
    "docling>=2.20.0",
]
structured = [
    "instructor>=1.7.0",
]
eval = [
    "datasets>=3.2.0",
    "numpy>=2.2.0",
    "tabulate>=0.9.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
terracemem = "terracemem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terracemem"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["terracemem"]

[[tool.mypy.overrides]]
module = ["jieba", "docling.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
